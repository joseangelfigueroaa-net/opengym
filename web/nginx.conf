# Trainnery — serves the static app AND proxies /api to the backend, so the whole app lives on
# ONE origin (required for WebAuthn / passkeys). Behind Cloudflare and Coolify's Traefik.
#
# Caching, by how often each kind of file changes:
#   /assets/*           hashed by Vite: a new build means a new name → cached for a year, immutable
#   index.html, sw.js,  the entry points that point at those hashes → always revalidated, so a
#   manifest.json       deploy shows up on the next load
#   icons, logo         stable names that could change with a rebrand → a week
#   /img, /gif          exercise media from the dataset, never edited → 30 days, immutable
#   /api/*              private per user → the API sends no-store itself
#
# security-headers.inc is included again in every location that sets a header: in nginx one
# add_header inside a location drops everything inherited from the server block.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/conf.d/security-headers.inc;

    # API → backend container. Uploads arrive base64 in JSON (a 3.5 MB file is ~4.7 MB), above
    # nginx's 1 MB default; the API enforces its own, tighter limit per route.
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/(index\.html|sw\.js|manifest\.json)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(img|gif)/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|svg|ico|webp)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback; index.html itself is revalidated (above)
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
