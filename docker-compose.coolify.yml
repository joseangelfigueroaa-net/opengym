name: trainnery

# Trainnery on Coolify. Same three services as docker-compose.yml, with two differences:
# - no host ports: Coolify's Traefik routes trainnery.com to web:80 and terminates HTTPS
#   (the host's 80/443/8080 already belong to it);
# - settings in `environment:` instead of an .env file, with the production domain as default.
#   Each one can be overridden from the resource's Environment Variables in Coolify.
# Passkeys are bound to RP_ID: register no one until it is the final domain.

services:
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"
    exclude_from_hc: true

  api:
    build: ./api
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - COACH_CODEX_HOME=/codex
      - RP_ID=${RP_ID:-trainnery.com}
      - ORIGIN=${ORIGIN:-https://trainnery.com}
      - RP_NAME=${RP_NAME:-Trainnery}
      - INVITE_ONLY=${INVITE_ONLY:-1}
      - ADMIN_UIDS=${ADMIN_UIDS:-}
    volumes:
      - ./data:/data           # users, passkeys, per-user state, session secret — BACK THIS UP
      - ./data/codex:/codex

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
